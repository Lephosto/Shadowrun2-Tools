<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SR2 GM Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>/*@css*/</style>
</head>
<body>
<div class="wrap">
 <header class="srh" id="srh">
  <div class="srh-id"><h1 class="srh-name">SR2 GM Screen</h1><span class="srh-sub" id="srhSub">Baddies, encounters and the table</span></div>
  <nav class="srh-tools" aria-label="Tools"><a data-tool="builder">Runner Builder</a><a data-tool="locker">Gear Locker</a><a data-tool="gm">GM screen</a></nav>
  <div class="srh-ctl" id="srhCtl"><label for="skinSel">Colors<select id="skinSel"></select></label></div>
  <button type="button" class="srh-menu" aria-expanded="false" aria-controls="srhCtl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
 </header>
 <nav id="tabs" role="tablist" aria-label="GM screen"><button role="tab" data-tab="cat">Baddies</button><button role="tab" data-tab="enc" id="tabEnc">Encounter</button><button role="tab" data-tab="tbl">At the table</button></nav>
 <main id="view"></main>
 <p class="note">Stats come from the Shadowrun 2nd Edition core rulebook and the Corporate Security Handbook, with printed page numbers. Gear comes from the Gear Locker. Saved in this browser only.</p>
</div>
<script>/*@data*/</script>
<script>
// Colors: the same choice as the Builder and the Gear Locker (saved under 'sr2-skin'). A GM screen pick from before is carried over once.
try{const o=localStorage.getItem('sr2-gm-theme'); if(o&&!localStorage.getItem('sr2-skin')) localStorage.setItem('sr2-skin',o); localStorage.removeItem('sr2-gm-theme');}catch(e){}
const SKINENV={sel:'skinSel',mono:'var(--f-mono)',map:{bg:'--bg',panel:'--panel',panel2:'--panel-2',ink:'--ink',muted:'--muted',line:'--line',accent:'--brand',accentInk:'--brand-ink',accentSoft:'--brand-soft',price:'--price',ok:'--ok',okSoft:'--ok-soft',warn:'--warn',warnSoft:'--warn-soft',bad:'--bad',badSoft:'--bad-soft',font:'--f-body'}};
/*@shared:skins*/
// ---------- Color modes, shared by both tools ----------
// Each page defines SKINENV = {map:{paletteKey:'--its-token'}, sel:'id of the <select>'}. The choice is saved under 'sr2-skin',
// so both tools on the same site open in the same colors. System/Light/Dark use the page's own tokens; the skins set every token inline.
const SKIN=(()=>{
const KEY='sr2-skin';
const P={
  matrix:{label:'Matrix (green screen)',base:'dark',mono:true,bg:'#020a04',panel:'#06140b',panel2:'#0b2013',ink:'#c2ffd2',muted:'#6cbc86',line:'#1d4a2c',accent:'#3dff7f',accentInk:'#021006',accentSoft:'#0e3a1d',ok:'#3dff7f',okSoft:'#0e3a1d',warn:'#e8ff66',warnSoft:'#2b3410',bad:'#ff6a5f',badSoft:'#3a1411',price:'#9dffbc'},
  neon:{label:'Neon (Seattle at night)',base:'dark',bg:'#0d0718',panel:'#160d26',panel2:'#211339',ink:'#f4ebff',muted:'#b19dd0',line:'#3b2662',accent:'#ff4fae',accentInk:'#1a0310',accentSoft:'#3f1337',ok:'#33f0d2',okSoft:'#0e3535',warn:'#ffd447',warnSoft:'#3a2e10',bad:'#ff6682',badSoft:'#401425',price:'#33f0d2'},
  amber:{label:'Amber terminal',base:'dark',mono:true,bg:'#110b02',panel:'#1b1306',panel2:'#271b09',ink:'#ffdcaa',muted:'#c9a066',line:'#4c3615',accent:'#ffb31a',accentInk:'#1a1000',accentSoft:'#3e2b07',ok:'#cbe26e',okSoft:'#2a3110',warn:'#ffd166',warnSoft:'#3d2c0a',bad:'#ff7f59',badSoft:'#3e1b0e',price:'#ffcb52'},
  paper:{label:'Paper (printed sheet)',base:'light',bg:'#ebe3d2',panel:'#fbf7ee',panel2:'#f2eadb',ink:'#2a2016',muted:'#6a5a44',line:'#d5c6ab',accent:'#8c2a10',accentInk:'#ffffff',accentSoft:'#f3ddd0',ok:'#3b6a1d',okSoft:'#e3ebd1',warn:'#875700',warnSoft:'#f3e2c0',bad:'#a3221a',badSoft:'#f4d7d1',price:'#8c2a10'},
  // Cosmic Spark: a night sky over the desert, IC lighting up gold "like a cosmic spark", starlight blue for money (his handle and his westerns)
  // Western set: High Noon by day, Cosmic Spark by night (Cosmic loves the old westerns)
  noon:{label:'High Noon',group:'Western',base:'light',deco:'sun',bg:'#e8d6b0',panel:'#f8eedb',panel2:'#efdfc0',ink:'#2b1d12',muted:'#6b5034',line:'#cdb48a',accent:'#973a17',accentInk:'#ffffff',accentSoft:'#f2d6c4',ok:'#386224',okSoft:'#dfe9cf',warn:'#7d5000',warnSoft:'#f2e0b5',bad:'#9b281c',badSoft:'#f3d3cb',price:'#1d5d78'},
  cosmic:{label:'Cosmic Spark',group:'Western',base:'dark',deco:'stars',bg:'#0a0820',panel:'#141130',panel2:'#1e1a42',ink:'#f5ecda',muted:'#bfae94',line:'#3a3366',accent:'#ffb23f',accentInk:'#1c1000',accentSoft:'#3d2a12',ok:'#62e3c6',okSoft:'#123a35',warn:'#ffd86b',warnSoft:'#3a3014',bad:'#ff6f61',badSoft:'#3f1620',price:'#9fd4ff'},
  contrast:{label:'High contrast',base:'dark',bg:'#000000',panel:'#000000',panel2:'#141414',ink:'#ffffff',muted:'#dadada',line:'#9a9a9a',accent:'#ffe600',accentInk:'#000000',accentSoft:'#332e00',ok:'#66ff94',okSoft:'#0a2a12',warn:'#ffbe57',warnSoft:'#332000',bad:'#ff7a7a',badSoft:'#3a0d0d',price:'#8adcff'}
};
// Parked 2026-11-22 for the redesign: only Match my device, Light and Dark are offered. A saved skin stays in storage untouched
// and reads as 'system' while parked, so setting PARKED to false brings every pick back as it was.
const PARKED=true;
const LIST=[['system','Match my device'],['light','Light'],['dark','Dark'],...(PARKED?[]:Object.entries(P).map(([k,v])=>[k,v.label]))];
let set=[], prev=null; // prev: the site-wide colors before the last pick, so a page can hand that pick to one character instead
const DECO={stars:'html[data-skin] body{background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,240,210,.85) 50%,transparent 51%),radial-gradient(1px 1px at 68% 9%,rgba(255,240,210,.7) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 84% 33%,rgba(255,178,63,.9) 50%,transparent 51%),radial-gradient(1px 1px at 33% 62%,rgba(159,212,255,.75) 50%,transparent 51%),radial-gradient(1px 1px at 52% 41%,rgba(255,240,210,.6) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 7% 84%,rgba(255,240,210,.8) 50%,transparent 51%),radial-gradient(1px 1px at 91% 76%,rgba(159,212,255,.7) 50%,transparent 51%),radial-gradient(120% 70% at 50% 120%,rgba(255,140,40,.14),transparent 60%);background-size:420px 420px,420px 420px,420px 420px,420px 420px,420px 420px,420px 420px,420px 420px,100% 100%;background-attachment:fixed}',
  sun:'html[data-skin] body{background-image:radial-gradient(60% 45% at 85% -10%,rgba(255,214,140,.55),transparent 70%),radial-gradient(140% 60% at 50% 115%,rgba(163,92,40,.18),transparent 65%);background-attachment:fixed}'};
function deco(kind){let el=document.getElementById('skinDeco'); if(!kind){if(el) el.remove(); return;} if(!el){el=document.createElement('style'); el.id='skinDeco'; document.head.appendChild(el);} el.textContent=DECO[kind]||'';}
const env=()=>(typeof SKINENV!=='undefined'?SKINENV:{map:{}});
function get(){try{const v=localStorage.getItem(KEY); return LIST.some(x=>x[0]===v)?v:'system';}catch(e){return 'system';}}
function apply(id,save){const R=document.documentElement, E=env();
  set.forEach(t=>R.style.removeProperty(t)); set=[]; R.style.removeProperty('color-scheme'); R.removeAttribute('data-skin');
  if(id==='light'||id==='dark') R.setAttribute('data-theme',id); else R.removeAttribute('data-theme');
  const p=P[id]; deco(p&&p.deco);
  if(p){R.setAttribute('data-theme',p.base); R.setAttribute('data-skin',id); R.style.setProperty('color-scheme',p.base);
    Object.entries(E.map).forEach(([k,tok])=>{const v=k==='font'?(p.mono?E.mono:null):p[k]; if(v){R.style.setProperty(tok,v); set.push(tok);}});}
  if(save){try{localStorage.setItem(KEY,id);}catch(e){}}
  const s=E.sel&&document.getElementById(E.sel); if(s&&s.value!==id) s.value=id;}
function options(cur){const o=([k,l])=>`<option value="${k}"${k===cur?' selected':''}>${l}</option>`, G={}; const flat=LIST.filter(([k])=>!(P[k]&&P[k].group)).map(o).join('');
  LIST.forEach(x=>{const g=P[x[0]]&&P[x[0]].group; if(g) (G[g]=G[g]||[]).push(x);}); return flat+Object.entries(G).map(([g,L])=>`<optgroup label="${g}">${L.map(o).join('')}</optgroup>`).join('');}
function now(){const E=env(); let r=null; try{r=E.runner&&E.runner();}catch(e){} return r&&LIST.some(x=>x[0]===r)?r:get();}
function init(){const E=env(); const s=E.sel&&document.getElementById(E.sel); const cur=now();
  if(s){s.innerHTML=options(cur); s.addEventListener('change',()=>{const E2=env(); if(E2.pick&&E2.pick(s.value)) apply(s.value,false); else {prev=get(); apply(s.value,true);}});}
  apply(cur,false);
  window.addEventListener('storage',e=>{if(e.key===KEY) apply(now(),false);});}
function restorePrev(){if(prev!=null){try{localStorage.setItem(KEY,prev);}catch(e){} prev=null;}}
return {P,LIST,get,now,apply,init,restorePrev};
})();
/*@end:skins*/
/*@shared:srhead*/
// ---------- The shared header (all three tools) ----------
// Fills the tool links for where the page is running, and opens and closes the phone menu.
// On the site: builder.html, gear-locker.html, gm-screen.html. Offline: the SR2_*.html files side by side.
// Anywhere else (an artifact, a renamed file) the other tools have no address, so only the current one shows.
// Version (2026-11-23): build.py writes a short code for each build into BUILD. The header shows it, links between the
// tools on the site carry ?v=CODE so browsers fetch a fresh copy, and on the site the page checks version.txt and offers
// a refresh when a newer build is out. Saved characters live in browser storage for the whole site, so a refresh keeps them.
const SRHEAD=(()=>{
const BUILD='@SR2BUILD@'; const built=/^[0-9a-f]{7}$/.test(BUILD);
const SITE={builder:'builder.html',locker:'gear-locker.html',gm:'gm-screen.html'};
const FILE={builder:'SR2_Runner_Builder.html',locker:'SR2_Gear_Locker.html',gm:'SR2_GM_Screen.html'};
function hrefs(){const f=(location.pathname.split('/').pop()||'').toLowerCase();
  if(onSite()) return built?Object.fromEntries(Object.entries(SITE).map(([k,v])=>[k,v+'?v='+BUILD])):SITE;
  if(location.protocol==='file:'&&/^sr2_/.test(f)) return FILE;
  return null;}
function onSite(){return /^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname);}
let lastCheck=0, armed=false;
function check(){if(!built||!onSite()) return; const now=Date.now(); if(lastCheck&&now-lastCheck<6e5) return; lastCheck=now;
  fetch('version.txt?t='+now,{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=String(t||'').trim(); if(/^[0-9a-f]{7}$/.test(t)&&t!==BUILD) notice(t);}).catch(()=>{});}
function notice(t){const h=document.getElementById('srh'); if(!h||document.getElementById('srhNew')) return; if(new URLSearchParams(location.search).get('v')===t) return; /* already asked for it: the site is still catching up */ const d=document.createElement('div'); d.id='srhNew'; d.className='srh-new'; d.setAttribute('role','status');
  d.innerHTML='<span>A newer version of this tool is out ('+t+'). Refreshing keeps your saved characters.</span><button type="button" class="ui-sec">Refresh</button>';
  d.querySelector('button').addEventListener('click',()=>{location.href=location.pathname+'?v='+t+location.hash;}); h.insertAdjacentElement('afterend',d);}
function init(tool){const h=document.getElementById('srh'); if(!h) return; const H=hrefs();
  if(built){let v=h.querySelector('.srh-ver'); if(!v){v=document.createElement('span'); v.className='srh-ver'; (h.querySelector('.srh-id')||h).appendChild(v);} v.textContent='Version '+BUILD; v.title='Which build of the tool this is';}
  check(); if(!armed){armed=true; document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') check();});}
  h.querySelectorAll('.srh-tools a[data-tool]').forEach(a=>{const t=a.dataset.tool;
    // safe to run again on a page that was saved after a first run (the Builder's standalone copy is one)
    if(t===tool){a.setAttribute('aria-current','page'); a.removeAttribute('href'); a.hidden=false; return;}
    a.removeAttribute('aria-current');
    if(H&&H[t]){a.href=H[t]; a.target='_blank'; a.rel='noopener'; a.hidden=false;} else {a.removeAttribute('href'); a.hidden=true;}});
  const b=h.querySelector('.srh-menu'); h.classList.remove('open'); if(b) b.setAttribute('aria-expanded','false');
  if(b) b.addEventListener('click',()=>{const o=!h.classList.contains('open'); h.classList.toggle('open',o); b.setAttribute('aria-expanded',String(o));});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&h.classList.contains('open')){h.classList.remove('open'); if(b){b.setAttribute('aria-expanded','false'); b.focus();}}});}
function sub(text){const s=document.getElementById('srhSub'); if(s) s.textContent=text||'';}
return {init,sub,hrefs,build:built?BUILD:''};
})();
/*@end:srhead*/
try{SKIN.init();}catch(e){}
try{SRHEAD.init('gm');}catch(e){}
</script>
<script>/*@js*/</script>
</body>
</html>
