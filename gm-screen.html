<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SR2 GM Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>/*@shared:tokens*/
/* ---------- Design tokens, shared by all three tools (color 11b, decided 2026-11-22) ----------
   One source: build.py copies this file into every tool. Change a value here and all three change with it.
   Blue (--brand) runs the interface: tabs, links, selected things, focus. Crimson (--action) is only for
   the main action on a screen (Roll, Add, Send) and for prices. */
:root{
  --bg:#e9eef6; --panel:#ffffff; --panel-2:#f3f6fb; --ink:#121a2a; --muted:#4f5d75; --line:#ccd6e6;
  --brand:#2453c7; --brand-ink:#ffffff; --brand-soft:#e3eafb;
  --action:#9c1d58; --action-ink:#ffffff; --action-soft:#f5e3ec; --price:#9c1d58;
  --ok:#1d7a4a; --ok-soft:#e1f2e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --focus:#2453c7;
  --f-display:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* five type sizes; nothing smaller than 12px */
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px;
  --tap:24px; --radius:8px;
  color-scheme:light;
}
@media (max-width:40em){:root{--tap:44px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --panel:#141d31; --panel-2:#1a2540; --ink:#e6ecf7; --muted:#9aa8c2; --line:#26324d;
  --brand:#7aa2ff; --brand-ink:#0d1220; --brand-soft:#1c2a4a;
  --action:#e2669e; --action-ink:#1a0d14; --action-soft:#3a1a2a; --price:#e2669e;
  --ok:#5fcf93; --ok-soft:#173226; --warn:#f0b04d; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --focus:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --panel:#141d31; --panel-2:#1a2540; --ink:#e6ecf7; --muted:#9aa8c2; --line:#26324d;
  --brand:#7aa2ff; --brand-ink:#0d1220; --brand-soft:#1c2a4a;
  --action:#e2669e; --action-ink:#1a0d14; --action-soft:#3a1a2a; --price:#e2669e;
  --ok:#5fcf93; --ok-soft:#173226; --warn:#f0b04d; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --focus:#7aa2ff; color-scheme:dark}
/*@end:tokens*/
/* The GM screen's older color names, pointed at the shared tokens */
:root{--paper:var(--panel);--panel2:var(--panel-2);--accent:var(--brand);--accent-ink:var(--brand-ink);--hit:var(--ok);--pool:var(--brand);--mono:var(--f-mono);--body:var(--f-body);--display:var(--f-display)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--action);background:var(--action);color:var(--action-ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{min-height:36px;font-size:13px;padding:0 10px}button.xs{min-height:32px;min-width:32px;padding:0 8px;font-size:13px}button.sq{width:40px;min-height:40px;padding:0}
select,input{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px 40px}
h1{font:700 26px/1 var(--display);margin:0}h2{font:700 18px var(--display);margin:0}
.tag{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
#tabs button{border-radius:999px;background:transparent;color:var(--ink);border-color:var(--line)}#tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lbl{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.lbl small{text-transform:none;letter-spacing:0;font-weight:400}
.note{font-size:13px;color:var(--muted)}.mono{font-family:var(--mono)}.big{font-size:18px;min-width:28px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cat{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:12px;align-items:start}
.list{position:sticky;top:64px;max-height:calc(100vh - 76px);display:flex;flex-direction:column;overflow:hidden}
.bhd{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
#q{width:100%}
.ftog{background:transparent;color:var(--brand);border-color:var(--brand)}.ftog[aria-expanded=true]{background:var(--brand-soft)}
.ftog .fn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;font-size:12px}
.fbox{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.fbox[hidden]{display:none}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}.fl.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:13px}
.chip[aria-pressed=true],.chip[aria-checked=true],.chip[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.items{overflow:auto;padding:6px}
.it{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:8px 10px;min-height:52px;font-weight:400}
.it:hover{background:var(--panel2)}.it[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
.itn{display:flex;flex-direction:column;min-width:0}.itn small{color:var(--muted)}
.tier{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.tier.t0{color:var(--ok)}.tier.t1{color:var(--accent)}.tier.t2{color:var(--warn)}.tier.t3{color:var(--bad)}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column}.st b{font-family:var(--mono);font-size:17px}
.detail p{margin:0}
.lo{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.gear{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line)}.r:first-child{border-top:0}.r.alt{background:var(--panel2)}.r small{color:var(--muted)}.r.tot{background:var(--panel2)}.r.tot b{color:var(--warn);font-size:17px}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}.add input{width:5rem}
.newb summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.grid2 input,.grid2 select{width:100%}
.enc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;align-items:start}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}.grp.on{border-color:var(--accent)}
.grp input[type=checkbox]{width:22px;height:22px;min-height:0}.gname{flex:1;min-width:0;font-weight:600}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mrow>span:first-child{flex:1;min-width:10rem}.mrow small{color:var(--muted)}
.order{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.orow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px;border-top:1px solid var(--line)}.orow:first-child{border-top:0}.orow.sel{background:var(--panel2)}.orow.runner{background:var(--panel2)}
.ini{font:600 20px var(--mono);min-width:34px;color:var(--warn)}.runner .ini{color:var(--accent)}
.on{flex:1 1 200px;display:flex;flex-direction:column;min-width:0}.on small{color:var(--muted)}
.trk{display:flex;gap:2px;align-items:center}.trk .lbl{margin-right:4px}
.bx{width:18px;height:26px;min-height:0;padding:0;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}.bx.mk{border-color:var(--muted)}.bx.lit.p{background:var(--bad);border-color:var(--bad)}.bx.lit.s{background:var(--accent);border-color:var(--accent)}
.stt{min-width:150px;font-size:13px;font-weight:600}.stt.ok{color:var(--ok)}.stt.warn{color:var(--warn)}.stt.bad{color:var(--bad)}
.act{margin-top:12px}.two{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.two>*{flex:1 1 340px;min-width:0}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.ctl select{width:100%}
.resb{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px}
.nums{display:flex;flex-wrap:wrap;gap:18px}.nums>div{display:flex;flex-direction:column}.nums b{font:600 26px var(--mono)}.nums small{color:var(--muted);font-size:12px;max-width:20rem}.warn{color:var(--warn)}
.dice{display:flex;flex-wrap:wrap;gap:4px}.die{min-width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted);font:600 14px var(--mono);border:2px solid transparent;padding:0 6px}.die.hit{background:var(--hit);color:var(--paper)}.die.pool{border-color:var(--pool)}
.copy{margin-top:12px}.copy input{width:100%;font-family:var(--mono);font-size:13px}
.imp{border:1px dashed var(--line);border-radius:8px;padding:8px}
@media (max-width:820px){.cat{grid-template-columns:1fr}.list{position:static;max-height:none}.items{max-height:60vh}}
.orow .rini{display:flex;gap:4px;align-items:center;margin-left:auto}
.orow .rhit{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.orow .rhmsg{flex-basis:100%;color:var(--muted)}
/* Phase 2: the first panel before a baddie is picked */
.start h3{margin:16px 0 6px;font-size:var(--t-md)}
.howto{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.howto li{margin:2px 0}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.newrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:16px}
.newb{margin-top:12px}
/*@shared:ui*/
/* ---------- Shared pieces, the same in all three tools (Phase 1 of the redesign, 2026-11-22) ----------
   Copied in by build.py after each tool's own styles, so these win where they overlap. Colors come only from tokens.css. */

/* Focus: 2px blue on everything you can tab to */
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Fields: checkboxes and radios grow from 13px to 24px, the smallest tap target (changed from 20px on 2026-11-22) */
input[type=checkbox],input[type=radio]{width:24px;height:24px;min-height:0;margin:0;flex:none;accent-color:var(--brand);padding:0}

/* Touch: every control at least 24px tall; 44px at phone width (--tap) */
:where(summary){min-height:24px}
:where(button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color])){min-height:var(--tap)}

/* Buttons. Main = crimson, one per panel (Roll, Add, Buy, Send). Secondary = blue outline. Quiet = text only. */
.ui-main{background:var(--action)!important;color:var(--action-ink)!important;border:1px solid var(--action)!important}
.ui-main:hover{filter:brightness(1.08)}
.ui-main:disabled{opacity:.45;filter:none}
.ui-sec{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.ui-quiet{background:transparent;color:var(--brand);border:1px solid transparent}

/* Page cites: one small chip everywhere, e.g. "core p. 254" */
.cite{display:inline-block;font:500 var(--t-xs)/1.4 var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 6px;max-width:100%;overflow-wrap:anywhere;vertical-align:.08em}

/* Tags: ok, warn, bad, neutral */
.ui-tag{display:inline-block;font:600 var(--t-xs)/1.5 var(--f-body);padding:0 8px;border-radius:4px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.ui-tag.ok{background:var(--ok-soft);color:var(--ok)} .ui-tag.warn{background:var(--warn-soft);color:var(--warn)} .ui-tag.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- The shared header ----------
   Laptop: tool name (Chakra Petch), the three tools with the current one marked, the tool's own controls, Colors at the right.
   Phone: one row with the tool name, a line under it (the runner's name), and a Menu button that opens the rest. */
.srh{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--line);position:relative}
.srh-id{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.srh-name{font:600 var(--t-xl)/1.15 var(--f-display);letter-spacing:.01em;color:var(--ink);margin:0}
.srh-sub{font:400 var(--t-xs)/1.4 var(--f-body);color:var(--muted);min-height:1.4em}
.srh-ver{font:400 var(--t-xs)/1.4 var(--f-mono);color:var(--muted)}
.srh-new{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;padding:8px 12px;border:1px solid var(--brand);border-radius:var(--radius);background:var(--brand-soft);color:var(--ink);font:500 var(--t-sm)/1.4 var(--f-body)}
.srh-new button{min-height:var(--tap);padding:0 14px;border-radius:var(--radius);font:600 var(--t-sm)/1 var(--f-body);cursor:pointer}
.srh-tools{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.srh-tools a{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:7px;font:500 var(--t-sm)/1 var(--f-body);color:var(--muted);text-decoration:none;white-space:nowrap}
.srh-tools a:hover{color:var(--brand)}
.srh-tools a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.srh-ctl{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.srh-ctl label{display:inline-flex;flex-direction:row;align-items:center;gap:6px;font:600 var(--t-xs)/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.srh-ctl label.plain{text-transform:none;letter-spacing:0;font-weight:500}
.srh-menu{display:none;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;font:600 var(--t-sm)/1 var(--f-body);cursor:pointer}
.srh-menu svg{width:20px;height:20px}
@media (max-width:40em){
  .srh{flex-wrap:nowrap;margin-bottom:12px;padding-bottom:8px}
  .srh-name{font-size:var(--t-lg)}
  .srh-id{min-width:0;flex:1}
  .srh-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srh-menu{display:inline-flex;min-width:44px;justify-content:center}
  .srh-tools,.srh-ctl{display:none}
  .srh.open{flex-wrap:wrap}
  .srh.open .srh-tools,.srh.open .srh-ctl{display:flex;width:100%;order:3}
  .srh.open .srh-tools a{flex:1;justify-content:center;min-height:44px}
  .srh.open .srh-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .srh.open .srh-ctl>:not(button){grid-column:1/-1}
  .srh.open .srh-ctl label{flex-direction:column;align-items:stretch;gap:4px}
  .srh.open .srh-ctl label.plain{flex-direction:row;align-items:center;gap:8px}
  .srh.open .srh-ctl select{width:100%;max-width:none!important}
}
@media print{.srh-tools,.srh-ctl,.srh-menu{display:none!important}}
/*@end:ui*/
</style>
</head>
<body>
<div class="wrap">
 <header class="srh" id="srh">
  <div class="srh-id"><h1 class="srh-name">SR2 GM Screen</h1><span class="srh-sub" id="srhSub">Baddies, encounters and the table</span></div>
  <nav class="srh-tools" aria-label="Tools"><a data-tool="builder">Runner Builder</a><a data-tool="locker">Gear Locker</a><a data-tool="gm">GM screen</a></nav>
  <div class="srh-ctl" id="srhCtl"><label for="skinSel">Colors<select id="skinSel"></select></label></div>
  <button type="button" class="srh-menu" aria-expanded="false" aria-controls="srhCtl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
 </header>
 <nav id="tabs" role="tablist" aria-label="GM screen"><button role="tab" data-tab="cat">Baddies</button><button role="tab" data-tab="enc" id="tabEnc">Encounter</button><button role="tab" data-tab="tbl">At the table</button></nav>
 <main id="view"></main>
 <p class="note">Stats come from the Shadowrun 2nd Edition core rulebook and the Corporate Security Handbook, with printed page numbers. Gear comes from the Gear Locker. Saved in this browser only.</p>

// ---------- The shared header (all three tools) ----------
// Fills the tool links for where the page is running, and opens and closes the phone menu.
// On the site: builder.html, gear-locker.html, gm-screen.html. Offline: the SR2_*.html files side by side.
// Anywhere else (an artifact, a renamed file) the other tools have no address, so only the current one shows.
// Version (2026-11-23): build.py writes a short code for each build into BUILD. The header shows it, links between the
// tools on the site carry ?v=CODE so browsers fetch a fresh copy, and on the site the page checks version.txt and offers
// a refresh when a newer build is out. Saved characters live in browser storage for the whole site, so a refresh keeps them.
const SRHEAD=(()=>{
const BUILD='47cab4f'; const built=/^[0-9a-f]{7}$/.test(BUILD);
const SITE={builder:'builder.html',locker:'gear-locker.html',gm:'gm-screen.html'};
const FILE={builder:'SR2_Runner_Builder.html',locker:'SR2_Gear_Locker.html',gm:'SR2_GM_Screen.html'};
function hrefs(){const f=(location.pathname.split('/').pop()||'').toLowerCase();

  if(location.protocol==='file:'&&/^sr2_/.test(f)) return FILE;
  return null;}
function onSite(){return /^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname);}
let lastCheck=0, armed=false;
function check(){if(!built||!onSite()) return; const now=Date.now(); if(lastCheck&&now-lastCheck<6e5) return; lastCheck=now;
  fetch('version.txt?t='+now,{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=String(t||'').trim(); if(/^[0-9a-f]{7}$/.test(t)&&t!==BUILD) notice(t);}).catch(()=>{});}
function notice(t){const h=document.getElementById('srh'); if(!h||document.getElementById('srhNew')) return; if(new URLSearchParams(location.search).get('v')===t) return; /* already asked for it: the site is still catching up */ const d=document.createElement('div'); d.id='srhNew'; d.className='srh-new'; d.setAttribute('role','status');
  d.innerHTML='<span>A newer version of this tool is out ('+t+'). Refreshing keeps your saved characters.</span><button type="button" class="ui-sec">Refresh</button>';
  d.querySelector('button').addEventListener('click',()=>{location.href=location.pathname+'?v='+t+location.hash;}); h.insertAdjacentElement('afterend',d);}
function init(tool){const h=document.getElementById('srh'); if(!h) return; const H=hrefs();
  if(built){let v=h.querySelector('.srh-ver'); if(!v){v=document.createElement('span'); v.className='srh-ver'; (h.querySelector('.srh-id')||h).appendChild(v);} v.textContent='Version '+BUILD; v.title='Which build of the tool this is';}
  check(); if(!armed){armed=true; document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') check();});}
  h.querySelectorAll('.srh-tools a[data-tool]').forEach(a=>{const t=a.dataset.tool;
    // safe to run again on a page that was saved after a first run (the Builder's standalone copy is one)
    if(t===tool){a.setAttribute('aria-current','page'); a.removeAttribute('href'); a.hidden=false; return;}
    a.removeAttribute('aria-current');
    if(H&&H[t]){a.href=H[t]; a.target='_blank'; a.rel='noopener'; a.hidden=false;} else {a.removeAttribute('href'); a.hidden=true;}});
  const b=h.querySelector('.srh-menu'); h.classList.remove('open'); if(b) b.setAttribute('aria-expanded','false');
  if(b) b.addEventListener('click',()=>{const o=!h.classList.contains('open'); h.classList.toggle('open',o); b.setAttribute('aria-expanded',String(o));});

return {init,sub,hrefs,build:built?BUILD:''};
})();

  else if(a==='newblock'){T.nfOpen=true;}
  else if(a==='saveblock'){const N=T.nf; if(!N.n.trim()){T.msg='Give it a name first.'; return render();} const skm={}; String(N.sk).split(',').forEach(x=>{const m=x.trim().match(/^(.*?)\s+(\d+)$/); if(m) skm[m[1]]=+m[2];});
    const a8=N.a.map((v,i)=>i===6?v:+v||0); const veh=N.kind==='veh', crit=N.kind==='crit'||veh; const id='u'+Date.now().toString(36);
    G.custom.push({id,n:N.n.trim(),src:'mine',pg:'typed in by the GM',role:veh?'rigger':crit?'para':N.role,cls:veh?'veh':crit?'para':undefined,sen:veh?+N.sen||0:undefined,crit:crit?1:0,custom:1,a:a8,ini:[a8[7],Math.max(1,+N.iniD||1)],pool:crit?0:Math.floor((a8[1]+a8[4]+a8[5])/2),pro:crit?'critter':String(Math.min(4,Math.max(1,+N.pro||2))),sk:skm,atk:crit?N.atk:undefined,armC:+N.armC||0});
    G.sel=id; T.nf=null; T.nfOpen=false;}
  else if(a==='delblock'){G.custom=G.custom.filter(x=>x.id!==G.sel); G.groups.forEach(g=>{g.m.filter(x=>x.b===G.sel).forEach(x=>purge(g.id+'-'+x.k+'-')); g.m=g.m.filter(x=>x.b!==G.sel);}); G.sel=null;}
  else if(a==='import'){T.imp=importList();}
  else if(a==='impall'){(T.imp||[]).forEach(c=>{if(!G.runners.some(r=>r.from===c.id)) G.runners.push({n:c.n,r:c.r,d:c.d,ini:0,from:c.id});});}
  else if(a==='addrunner'){const n=$('rnName').value.trim(); if(!n) return $('rnName').focus(); G.runners.push({n,ini:+$('rnIni').value||0,r:null,d:null});}
  else if(a==='rollini'){C.forEach(x=>{G.ini[x.id]=x.b.ini[0]+iniRoll(x.b.ini[1]);});}
  else if(a==='copyini'){copyOut(`&{template:default} {{name=${G.enc}: enemy Initiative}} `+C.map(x=>`{{${x.name}=[[${x.b.ini[0]}+${x.b.ini[1]}d6${wm(x.id)?'-'+wm(x.id):''}]]}}`).join(' '),'Initiative');}
  else if(a==='newturn'){G.ini={}; G.pools={}; G.runners.forEach(r=>r.ini=0); T.roll=null;}
  else if(c&&(a==='roll'||a==='rres')){const K=T.cur; G.pools[c.id]=poolLeft(c)-K.sp; T.roll={cid:c.id,r:rollN(K.dice,K.tn),tn:K.tn,pool:K.sp+K.th,res:a==='rres',lvl:K.lvl,stun:K.stun,spell:K.spell}; T.spend=0; T.copy=null;}
  else if(c&&a==='copyatk'){const K=T.cur; G.pools[c.id]=poolLeft(c)-K.sp; copyOut(`&{template:default} {{name=${c.name}: ${K.A.n}}} {{Dice=${K.dice} (${K.src})}} {{Target number=${K.tn}}} {{Successes=${r20(K.dice,K.tn)}}} {{Damage=${K.dmg||K.A.dmg}}}`,'Attack'); T.spend=0;}
  else if(c&&a==='copyres'){const K=T.cur; G.pools[c.id]=poolLeft(c)-K.sp; copyOut(`&{template:default} {{name=${c.name} resists ${T.gh.pow}${T.gh.lvl}}} {{Target number=${K.tn}}} {{${T.gh.kind==='spellM'?'Willpower':'Body'}=${r20(T.gh.kind==='spellM'?+c.b.a[5]:c.b.a[0]+(c.b.derm||0),K.tn)}}}`+(K.sp+K.th?` {{Pool or Threat=${r20(K.sp+K.th,K.tn)}}}`:'')+` {{If successes tie=${T.gh.lvl}}}`,'Damage resistance'); T.spend=0;}
  else if(c&&a==='mark'){const R=T.roll; if(R&&R.final){const cur=D(c.id), k=R.stun?'s':'p'; G.dmg[c.id]={...cur,[k]:Math.min(k==='p'?11+c.b.a[0]:10,cur[k]+BOXES[R.final])}; T.roll=null;}}
  else if(c&&a==='refresh'){delete G.pools[c.id];}
  render();});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sort'){G.sort=t.value;} else if(t.id==='addItem'&&t.value){const k=G.sel+':c'; (G.load[k]=G.load[k]||[]).push(t.value);}
  else if(t.dataset.gname){const g=G.groups.find(x=>x.id===t.dataset.gname); g.name=t.value||g.name;}
  else if(t.id==='encName'){G.enc=t.value||'Encounter';} else if(t.id==='atkSel'){T.atk=+t.value; T.rng=0; T.fm='ss'; T.roll=null;} else if(t.id==='fmSel'){T.fm=t.value; T.roll=null;} else if(t.id==='rngSel'){T.rng=+t.value;}
  else if(t.id==='ghKind'){T.gh.kind=t.value; T.roll=null;} else if(t.id==='ghLvl'){T.gh.lvl=t.value; T.roll=null;} else if(t.id==='ghDt'){T.gh.stun=t.value==='s'; T.roll=null;}
  else if(t.dataset.nf){const k=t.dataset.nf; if(k[0]==='a'&&/^a\d$/.test(k)) T.nf.a[+k[1]]=+t.value; else T.nf[k]=t.value; T.nfOpen=true; return;}
  else if(t.id==='addTo'||t.id==='addN'){T.addTo=$('addTo').value; T.addN=+$('addN').value||1; return;}
  else return; render();});
let qt; document.addEventListener('input',e=>{if(e.target.id==='q'){G.q=e.target.value; clearTimeout(qt); qt=setTimeout(render,200);}});
window.SR2GM={G,T,copies,build,render};
render();
})();
</script>
